<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Intl.Segmenter を使った、単語・文字・文単位のテキスト表示デモ。">
  <title>ワードリビール デモ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="intro" aria-labelledby="page-title">
      <div>
        <p class="section-label">Text Reveal Lab</p>
        <h1 id="page-title">
          <span>言葉が現れる</span>
          <span>リズムを試す</span>
        </h1>
        <p class="intro-text">
          セリフや字幕を、単語・文字・文ごとの単位で少しずつ表示します。
          日本語、英語、中国語などで分割の違いと読み心地を確認できます。
        </p>
      </div>
      <div class="status-card" aria-label="デモの特徴">
        <span>Intl.Segmenter</span>
        <strong>多言語分割</strong>
        <small>非対応ブラウザでは簡易分割に切り替わります。</small>
      </div>
    </section>

    <div class="workspace">
      <section class="panel controls-panel" aria-labelledby="control-title">
        <div class="panel-heading">
          <p class="section-label">Controls</p>
          <h2 id="control-title">表示設定</h2>
        </div>

        <label class="field">
          <span>表示するテキスト</span>
          <textarea id="text">死んだと思ってた。

いや、待って。答えなくていい。

扉には鍵が三つある。……そのうち一つが、今、勝手に開いた。</textarea>
        </label>

        <div class="form-grid">
          <label class="field">
            <span>分割言語</span>
            <select id="locale">
              <option value="ja-JP" selected>日本語 / ja-JP</option>
              <option value="en-US">英語 / en-US</option>
              <option value="zh-CN">中国語 / zh-CN</option>
              <option value="th-TH">タイ語 / th-TH</option>
            </select>
          </label>

          <label class="field">
            <span>表示単位</span>
            <select id="mode">
              <option value="word" selected>単語ごと</option>
              <option value="grapheme">文字ごと</option>
              <option value="sentence">文ごと</option>
              <option value="instant">すぐに表示</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span>速度</span>
          <span class="slider-row">
            <input id="speed" type="range" min="1" max="18" step="0.5" value="7" aria-describedby="speed-out">
            <output id="speed-out">7.0/秒</output>
          </span>
        </label>

        <div class="toggles" aria-label="追加設定">
          <label>
            <input id="punctuation-pause" type="checkbox" checked>
            <span>句読点で間を置く</span>
          </label>
          <label>
            <input id="soft-fade" type="checkbox" checked>
            <span>軽くフェードイン</span>
          </label>
        </div>

        <div class="actions" aria-label="操作">
          <button class="button primary" id="play" type="button">再生</button>
          <button class="button" id="complete" type="button">最後まで表示</button>
          <button class="button ghost" id="sample-ja" type="button">日本語</button>
          <button class="button ghost" id="sample-en" type="button">英語</button>
          <button class="button ghost" id="sample-zh" type="button">中国語</button>
        </div>

        <p class="hint">
          Space キーでも操作できます。再生中は最後まで表示し、停止中は再生を開始します。
        </p>
      </section>

      <section class="panel preview-panel" aria-labelledby="preview-title">
        <div class="panel-heading">
          <p class="section-label">Preview</p>
          <h2 id="preview-title">表示プレビュー</h2>
        </div>

        <div class="stage">
          <article class="dialogue-box" aria-live="polite">
            <div class="speaker">DEMO</div>
            <p class="revealed-text">
              <span id="render"></span><span class="cursor" id="cursor" aria-hidden="true"></span>
            </p>
          </article>
        </div>

        <dl class="meta" id="meta" aria-label="表示状態"></dl>
      </section>
    </div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
