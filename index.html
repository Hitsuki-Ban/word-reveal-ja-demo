<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="日本語RPGとビジュアルノベル向けのタイプライター演出プレビュー。">
  <title>Typewriter Preview</title>
  <link rel="stylesheet" href="styles.css?v=20260520-rpg2">
</head>
<body>
  <main class="app-shell">
    <header class="topbar" aria-labelledby="app-title">
      <div class="brand-mark" aria-hidden="true">◇</div>
      <div>
        <h1 id="app-title">Typewriter Preview</h1>
      </div>
      <div class="topbar-status" aria-label="現在の設定">
        <span id="top-mode">文字</span>
        <span id="top-speed">18 CPS</span>
      </div>
    </header>

    <div class="workspace">
      <section class="editor-panel" aria-labelledby="editor-title">
        <div class="panel-title">
          <h2 id="editor-title">入力</h2>
        </div>

        <label class="field">
          <span>話者</span>
          <input id="speaker-input" type="text" maxlength="18" value="アカリ" autocomplete="off">
        </label>

        <label class="field script-field">
          <span>本文</span>
          <textarea id="text" maxlength="500">月明かりが導くこの道は、
古の願いとともに在る。
我らの歩みが、未来を照らす光となりますように。</textarea>
          <output id="char-count" for="text">0 / 500</output>
        </label>

        <label class="field speed-field">
          <span>速度</span>
          <span class="speed-row">
            <input id="speed" type="range" min="2" max="40" step="1" value="18" aria-describedby="speed-out">
            <output id="speed-out" for="speed">18 CPS</output>
          </span>
        </label>

        <div class="primary-actions" aria-label="再生操作">
          <button class="button primary" id="play" type="button">
            <span aria-hidden="true">▶</span>
            再生
          </button>
          <button class="button" id="complete" type="button">
            <span aria-hidden="true">◉</span>
            全文表示
          </button>
        </div>

        <details class="advanced" id="advanced-settings">
          <summary>詳細設定</summary>
          <div class="advanced-grid">
            <label class="field">
              <span>表示単位</span>
              <select id="mode">
                <option value="grapheme" selected>文字</option>
                <option value="word">単語</option>
                <option value="sentence">文</option>
                <option value="instant">即時</option>
              </select>
            </label>

            <label class="field">
              <span>分割言語</span>
              <select id="locale">
                <option value="ja-JP" selected>日本語</option>
                <option value="en-US">英語</option>
                <option value="zh-CN">中国語</option>
                <option value="th-TH">タイ語</option>
              </select>
            </label>

            <label class="field">
              <span>ウィンドウ</span>
              <select id="window-style">
                <option value="classic" selected>クラシック</option>
                <option value="glass">透過</option>
                <option value="compact">コンパクト</option>
              </select>
            </label>

            <label class="field">
              <span>サンプル</span>
              <select id="sample-select">
                <option value="shrine" selected>参道</option>
                <option value="battle">戦闘</option>
                <option value="narration">地の文</option>
              </select>
            </label>
          </div>

          <div class="toggles" aria-label="演出設定">
            <label>
              <input id="punctuation-pause" type="checkbox" checked>
              <span>句読点で間を置く</span>
            </label>
            <label>
              <input id="soft-fade" type="checkbox" checked>
              <span>軽くフェードイン</span>
            </label>
          </div>
        </details>
      </section>

      <section class="preview-panel" aria-labelledby="preview-title">
        <div class="preview-toolbar">
          <div class="panel-title">
            <h2 id="preview-title">プレビュー</h2>
          </div>
          <div class="preview-modes" aria-label="プレビューサイズ">
            <button class="icon-button active" type="button" aria-label="ワイド表示">▭</button>
            <button class="icon-button" type="button" aria-label="モバイル確認">▯</button>
          </div>
        </div>

        <div class="stage" id="stage">
          <div class="scene" aria-hidden="true"></div>

          <article class="dialogue-box classic" id="dialogue-box" aria-live="polite">
            <div class="portrait" aria-hidden="true">
              <img src="assets/portrait-placeholder.png?v=20260520-rpg2" alt="">
            </div>
            <div class="dialogue-content">
              <div class="nameplate" id="speaker-name">アカリ</div>
              <p class="revealed-text"><span id="render"></span><span class="cursor" id="cursor" aria-hidden="true"></span></p>
            </div>
            <span class="advance-marker" aria-hidden="true"></span>
          </article>
        </div>

        <dl class="meta" id="meta" aria-label="表示状態"></dl>
      </section>
    </div>
  </main>

  <script src="app-core.js?v=20260520-rpg2"></script>
  <script src="app.js?v=20260520-rpg2" defer></script>
</body>
</html>
